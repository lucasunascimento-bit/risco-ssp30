name: Análise de Fraude SSP30

on:
  workflow_dispatch:        # Rodado manualmente pelo botão no dashboard
  schedule:
    - cron: '0 11 * * 1'   # Toda segunda-feira às 08:00 BRT (11:00 UTC)

permissions:
  contents: write

jobs:
  analise-fraude:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Configurar credenciais Google
        run: |
          mkdir -p ~/.config/gcloud
          echo '${{ secrets.GOOGLE_CREDENTIALS }}' > ~/.config/gcloud/application_default_credentials.json

      - name: Gerar dashboard de fraude
        run: python analise_fraude.py

      - name: Publicar no GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fraude.html sinistros.html ofensores.html _acumulo_bloqueio.json
          git diff --staged --quiet || git commit -m "Dashboard fraude atualizado: $(date +'%d/%m/%Y %H:%M UTC')"
          git push
