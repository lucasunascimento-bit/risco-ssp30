name: Risco SSP30 - Atualização Diária

on:
  schedule:
    - cron: '0 11 * * *'   # Todo dia às 08:00 horário de Brasília (11:00 UTC)
  workflow_dispatch:        # Permite rodar manualmente pelo GitHub também

permissions:
  contents: write           # Necessário para fazer commit do dashboard gerado

jobs:
  atualizar-risco:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Configurar credenciais Google
        run: |
          mkdir -p ~/.config/gcloud
          echo '${{ secrets.GOOGLE_CREDENTIALS }}' > ~/.config/gcloud/application_default_credentials.json

      - name: Rodar script de atualização
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python atualizacao_risco.py

      - name: Gerar dashboard HTML
        run: python gerar_dashboard.py

      - name: Publicar dashboard no GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Dashboard atualizado: $(date +'%d/%m/%Y %H:%M UTC')"
          git push
