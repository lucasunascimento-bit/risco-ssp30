name: Atualizar Dashboard Fraude

on:
  # schedule desabilitada — acesso automatico externo ao BQ foi sinalizado pelo TI
  # - cron: '*/5 * * * *'
  workflow_dispatch:          # roda apenas manualmente pelo GitHub

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Configurar credenciais Google
        run: |
          mkdir -p ~/.config/gcloud
          echo '${{ secrets.GOOGLE_ADC_CREDENTIALS }}' > ~/.config/gcloud/application_default_credentials.json

      - name: Restaurar cache BQ
        uses: actions/cache@v4
        with:
          path: |
            _bq_cache/
            bq_investigacao_cache.json
          key: bq-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            bq-cache-${{ runner.os }}-

      - name: Gerar dashboard
        env:
          CI: "true"
        run: python analise_fraude.py

      - name: Publicar se houve mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fraude.html sinistros.html
          if git diff --staged --quiet; then
            echo "Sem mudanças no dashboard."
          else
            git commit -m "Auto-update: $(date -u '+%d/%m/%Y %H:%M UTC')"
            git pull --rebase origin main
            git push
          fi
